<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<!-- No favicon: an empty data URL stops the browser's /favicon.ico probe. -->
		<link rel="icon" href="data:," />
		<title>2048 AI</title>
		<!--
			The contract head from Kunkun's plugin theme guide: legible before any host
			pushes variables. Kept inline and tiny so the first paint is already themed.
		-->
		<style>
			:root {
				background: var(--background, Canvas);
				color: var(--foreground, CanvasText);
				font-family: var(--font-sans, system-ui);
			}
			/* The frame is a window, not a document: it fills the height it is given
			   and never scrolls. */
			html,
			body,
			main {
				height: 100%;
			}
			body {
				margin: 0;
				/* No scrollbar while the content fits the window (the declared
				   480x720 does); a very short window scrolls rather than squeezing
				   the board into a non-square shape. */
				overflow: auto;
			}
			main {
				box-sizing: border-box;
				max-width: 34rem;
				margin: 0 auto;
				padding: 0.75rem;
				display: flex;
				flex-direction: column;
				min-height: 0;
			}
			game-2048 {
				/* `flex-basis: 0`: the element must not be sized by the board it
				   contains, or measuring and resizing feed each other. */
				flex: 1 1 0;
				min-height: 0;
				min-width: 0;
				display: block;
			}
		</style>
		<script type="module" crossorigin src="./assets/index-BjDrGqvo.js"></script>
		<link rel="stylesheet" crossorigin href="./assets/index-CfxQSgKE.css">
	</head>
	<body>
		<main>
			<game-2048 id="game"></game-2048>
		</main>
	</body>
</html>
